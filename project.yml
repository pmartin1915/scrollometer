name: Scrollometer
options:
  bundleIdPrefix: com.martinapps
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: NN8F5WX25R
    CODE_SIGN_STYLE: Manual
packages:
  ScrollCore:
    path: Packages/ScrollCore
  ScrollStore:
    path: Packages/ScrollStore
targets:
  Scrollometer:
    platform: iOS
    deploymentTarget: "17.0"
    type: application
    bundleId: com.martinapps.scrolldistance
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: App/Odo.entitlements
    settings:
      base:
        # info: is deliberately NOT used — XcodeGen regenerates that plist on every
        # `xcodegen generate`, clobbering hand-authored keys. INFOPLIST_FILE keeps
        # the committed plists authoritative.
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Profile names are injected per-run on the xcodebuild command line
        # (ODO_PROFILE_* vars) so one project serves unsigned CI compiles,
        # dev-signed device builds, and App Store archives.
        PROVISIONING_PROFILE_SPECIFIER: $(ODO_PROFILE_APP)
    # xcodebuild -scheme/archive on CI needs a shared scheme; XcodeGen emits none by default.
    scheme: {}
    dependencies:
      - package: ScrollCore
      - package: ScrollStore
      - target: MonitorExtension
        embed: true
      - target: ReportExtension
        embed: true
      - target: OdoWidgets
        embed: true
  MonitorExtension:
    platform: iOS
    deploymentTarget: "17.0"
    type: app-extension
    bundleId: com.martinapps.scrolldistance.monitor
    sources:
      - path: MonitorExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: MonitorExtension/MonitorExtension.entitlements
    settings:
      base:
        INFOPLIST_FILE: MonitorExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: $(ODO_PROFILE_MONITOR)
    dependencies:
      - package: ScrollCore
  ReportExtension:
    platform: iOS
    deploymentTarget: "17.0"
    # DeviceActivityReport extensions are ExtensionKit extensions (EXAppExtensionAttributes),
    # not legacy NSExtension app extensions.
    type: extensionkit-extension
    bundleId: com.martinapps.scrolldistance.report
    sources:
      - path: ReportExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: ReportExtension/ReportExtension.entitlements
    settings:
      base:
        INFOPLIST_FILE: ReportExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: $(ODO_PROFILE_REPORT)
    dependencies:
      - package: ScrollCore
  OdoWidgets:
    platform: iOS
    deploymentTarget: "17.0"
    type: app-extension
    bundleId: com.martinapps.scrolldistance.widgets
    sources:
      - path: OdoWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: OdoWidgets/OdoWidgets.entitlements
    settings:
      base:
        INFOPLIST_FILE: OdoWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: $(ODO_PROFILE_WIDGETS)
    dependencies:
      - package: ScrollCore
      - package: ScrollStore
