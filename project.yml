name: Scrollometer
options:
  bundleIdPrefix: com.martinapps
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
packages:
  ScrollCore:
    path: Packages/ScrollCore
  ScrollStore:
    path: Packages/ScrollStore
targets:
  Scrollometer:
    platform: iOS
    deploymentTarget: "17.0"
    type: application
    bundleId: com.martinapps.scrolldistance
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: App/Odo.entitlements
    info:
      path: App/Info.plist
    dependencies:
      - package: ScrollCore
      - package: ScrollStore
      - target: MonitorExtension
        embed: true
      - target: ReportExtension
        embed: true
      - target: OdoWidgets
        embed: true
  MonitorExtension:
    platform: iOS
    deploymentTarget: "17.0"
    type: app-extension
    bundleId: com.martinapps.scrolldistance.monitor
    sources:
      - path: MonitorExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: MonitorExtension/MonitorExtension.entitlements
    info:
      path: MonitorExtension/Info.plist
    dependencies:
      - package: ScrollCore
  ReportExtension:
    platform: iOS
    deploymentTarget: "17.0"
    type: app-extension
    bundleId: com.martinapps.scrolldistance.report
    sources:
      - path: ReportExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: ReportExtension/ReportExtension.entitlements
    info:
      path: ReportExtension/Info.plist
    dependencies:
      - package: ScrollCore
  OdoWidgets:
    platform: iOS
    deploymentTarget: "17.0"
    type: app-extension
    bundleId: com.martinapps.scrolldistance.widgets
    sources:
      - path: OdoWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: OdoWidgets/OdoWidgets.entitlements
    info:
      path: OdoWidgets/Info.plist
    dependencies:
      - package: ScrollCore
      - package: ScrollStore
